name: Dependabot auto-merge

# Auto-merge Dependabot patch & minor updates once all required checks pass.
# Major updates are left open for manual review.
#
# Prerequisites (one-time, in repo Settings):
#   1. Settings -> General -> Pull Requests -> enable "Allow auto-merge".
#   2. Settings -> Rules/Branches -> protect `main` and require the CI status
#      checks (Lint, Tests, ...). Without required checks, auto-merge would
#      merge as soon as the PR is mergeable instead of waiting for green CI.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
