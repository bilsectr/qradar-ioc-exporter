line-length = 88
target-version = "py312"
extend-exclude = [".venv", "certs", "logs"]

[lint]
select = ["E", "F", "I", "B", "UP", "C4", "W"]

[lint.flake8-bugbear]
# FastAPI uses these in argument defaults by design (B008 false positives).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
